<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebria — Email verified</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #FDF8F3 0%, #FBEDE4 100%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #3D2C2A;
  }
  .card {
    background: #fff; border: 1px solid #EADFD6; border-radius: 24px;
    padding: 40px 28px; margin: 24px; max-width: 380px; text-align: center;
    box-shadow: 0 10px 30px rgba(122, 43, 34, 0.08);
  }
  .icon {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px;
    background: #6B1F2E; display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #fff;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p  { font-size: 15px; line-height: 1.55; color: #7A6A63; margin: 0; }
  .brand { margin-top: 26px; font-size: 12px; letter-spacing: 2px; color: #B9A79C; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">✓</div>
    <h1 id="title">Email verified!</h1>
    <p id="msg">Your email has been verified successfully. Please go back to the Celebria app and sign in to start planning your celebrations.</p>
    <div class="brand">Celebria · Where Celebration Begins</div>
  </div>
  <script>
    // Expired/invalid links arrive with error params in the URL hash or query.
    var p = new URLSearchParams(location.hash.slice(1) || location.search);
    if (p.get('error')) {
      document.getElementById('icon').textContent = '!';
      document.getElementById('title').textContent = 'Link expired';
      document.getElementById('msg').textContent =
        'This verification link is invalid or has expired. Please open the Celebria app and sign up again to receive a new email.';
    }
  </script>
</body>
</html>
