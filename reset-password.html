<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebria — Reset password</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #FDF8F3 0%, #FBEDE4 100%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #3D2C2A;
  }
  .card {
    background: #fff; border: 1px solid #EADFD6; border-radius: 24px;
    padding: 40px 28px; margin: 24px; max-width: 380px; width: 100%; box-sizing: border-box;
    text-align: center; box-shadow: 0 10px 30px rgba(122, 43, 34, 0.08);
  }
  .icon {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px;
    background: #6B1F2E; display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #fff;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p  { font-size: 15px; line-height: 1.55; color: #7A6A63; margin: 0; }
  .brand { margin-top: 26px; font-size: 12px; letter-spacing: 2px; color: #B9A79C; text-transform: uppercase; }
  form { margin-top: 24px; text-align: left; }
  label { font-size: 13px; color: #7A6A63; display: block; margin: 14px 0 6px; }
  input {
    width: 100%; height: 46px; border: 1px solid #EADFD6; border-radius: 12px;
    padding: 0 14px; font-size: 15px; color: #3D2C2A; box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #6B1F2E; }
  button {
    width: 100%; height: 48px; border: none; border-radius: 12px; margin-top: 20px;
    background: #6B1F2E; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #B3261E; font-size: 13px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">🔑</div>
    <h1 id="title">Reset your password</h1>
    <p id="msg">Choose a new password for your Celebria account.</p>

    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
      <div class="error" id="err"></div>
      <button id="submit" type="submit">Update password</button>
    </form>

    <div class="brand">Celebria · Where Celebration Begins</div>
  </div>
  <script>
    var SUPABASE_URL = 'https://vtzzdlntyvtxyaerzynn.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_xhJpLjVlj54dpoyLNuY60A_NpF-TnWL';

    var icon = document.getElementById('icon');
    var title = document.getElementById('title');
    var msg = document.getElementById('msg');
    var form = document.getElementById('form');
    var err = document.getElementById('err');
    var submitBtn = document.getElementById('submit');

    function showState(iconText, titleText, msgText) {
      icon.textContent = iconText;
      title.textContent = titleText;
      msg.textContent = msgText;
      form.style.display = 'none';
    }

    // Supabase's recovery link lands with access_token/type in the URL hash
    // (implicit flow) — never in the query string.
    var p = new URLSearchParams(location.hash.slice(1) || location.search);
    var accessToken = p.get('access_token');
    var type = p.get('type');

    if (p.get('error')) {
      showState('!', 'Link expired', 'This reset link is invalid or has expired. Please open the Celebria app and request a new one from the login screen.');
    } else if (!accessToken || type !== 'recovery') {
      showState('🔑', 'Open this from your email', 'Use the "Reset password" link Celebria emailed you — this page needs the link\'s token to continue.');
    } else {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = document.getElementById('pw').value;
        var pw2 = document.getElementById('pw2').value;
        err.textContent = '';

        if (pw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
        if (pw !== pw2) { err.textContent = 'Passwords do not match.'; return; }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating…';

        fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + accessToken,
          },
          body: JSON.stringify({ password: pw }),
        })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
          .then(function (result) {
            if (!result.ok) throw new Error(result.body && result.body.msg || result.body && result.body.error_description || 'Could not update password.');
            showState('✓', 'Password updated!', 'Your password has been changed. Go back to the Celebria app and sign in with your new password.');
          })
          .catch(function (e) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update password';
            err.textContent = e.message || 'Something went wrong. Please try again.';
          });
      });
    }
  </script>
</body>
</html>
