<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebria — RSVP</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #FDF8F3 0%, #FBEDE4 100%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #3D2C2A;
  }
  .card {
    background: #fff; border: 1px solid #EADFD6; border-radius: 24px;
    padding: 40px 28px; margin: 24px; max-width: 380px; text-align: center;
    box-shadow: 0 10px 30px rgba(122, 43, 34, 0.08);
  }
  .icon {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px;
    background: #6B1F2E; display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #fff;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p  { font-size: 15px; line-height: 1.55; color: #7A6A63; margin: 0; }
  .btn {
    display: block; width: 100%; margin-top: 22px; padding: 14px 0; border: 0;
    border-radius: 14px; font-size: 16px; cursor: pointer;
    background: #6B1F2E; color: #fff;
  }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  .cal {
    display: block; margin-top: 10px; padding: 12px 0; border-radius: 14px;
    border: 1px solid #6B1F2E; color: #6B1F2E; text-decoration: none; font-size: 15px;
  }
  .brand { margin-top: 26px; font-size: 12px; letter-spacing: 2px; color: #B9A79C; text-transform: uppercase; }

  /* Follow-up step: headcount + food preference, shown only after "Yes". */
  .field { text-align: left; margin-top: 22px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
    text-transform: uppercase; color: #9A857B; margin-bottom: 7px;
  }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid #EADFD6;
    background: #FBF3EA; color: #6B1F2E; font-size: 19px; cursor: pointer;
  }
  .stepper button:active { background: #F2E3D6; }
  .stepper span {
    flex: 1; text-align: center; font-size: 20px; font-weight: 600;
  }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    padding: 9px 15px; border-radius: 99px; border: 1px solid #EADFD6;
    background: #FBF3EA; color: #3D2C2A; font-size: 13.5px; cursor: pointer;
  }
  .pill.sel { background: #6B1F2E; border-color: #6B1F2E; color: #fff; }
  .skip {
    display: block; margin-top: 16px; font-size: 13px; color: #9A857B;
    text-decoration: underline; background: none; border: 0; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">💌</div>
    <h1 id="title">One tap to RSVP</h1>
    <p id="msg">Loading your invitation…</p>
    <button class="btn" id="btn" style="display:none"></button>
    <button class="skip" id="keepBtn" type="button" style="display:none">Keep my previous response</button>
    <div id="details" style="display:none">
      <div class="field">
        <label>How many people from your family are attending?</label>
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <span id="count">1</span>
          <button type="button" id="plus">+</button>
        </div>
      </div>
      <div class="field">
        <label>What's your food preference?</label>
        <div class="pills" id="foods"></div>
      </div>
      <button class="btn" id="saveDetails">Save</button>
      <button class="skip" id="skipDetails" type="button">Skip this for now</button>
    </div>
    <div id="cal" style="display:none"></div>
    <div class="brand">Celebria · Where Celebration Begins</div>
  </div>
  <script>
    // The email buttons land here with ?g=<guest>&r=confirmed|declined. The
    // actual write happens only on the explicit tap below, so inbox link
    // scanners can never RSVP on a guest's behalf.
    var FN = 'https://vtzzdlntyvtxyaerzynn.supabase.co/functions/v1/rsvp';
    var FOODS = ['Veg', 'Non-Veg', 'Vegan'];
    var p = new URLSearchParams(location.search);
    var g = p.get('g'), r = p.get('r');
    var icon = document.getElementById('icon'),
        title = document.getElementById('title'),
        msg = document.getElementById('msg'),
        btn = document.getElementById('btn'),
        keepBtn = document.getElementById('keepBtn'),
        details = document.getElementById('details'),
        countEl = document.getElementById('count'),
        foodsEl = document.getElementById('foods'),
        cal = document.getElementById('cal');
    var count = 1, food = null;

    function fail(t, m) {
      icon.textContent = '!'; title.textContent = t; msg.textContent = m;
      btn.style.display = 'none'; keepBtn.style.display = 'none'; details.style.display = 'none';
    }

    // "Add to calendar" for guests who accepted: a Google Calendar template
    // link, plus a client-generated .ics download for Apple/Outlook.
    function showCalendar(name, isoDate, city) {
      if (!isoDate) return;
      var s = isoDate.replace(/-/g, '');
      var end = new Date(isoDate + 'T12:00:00Z');
      end.setUTCDate(end.getUTCDate() + 1);
      var e = end.toISOString().slice(0, 10).replace(/-/g, '');
      var gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
        '&text=' + encodeURIComponent(name) + '&dates=' + s + '/' + e +
        (city ? '&location=' + encodeURIComponent(city) : '');
      var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Celebria//EN',
        'BEGIN:VEVENT', 'UID:' + Date.now() + '@celebria',
        'DTSTAMP:' + new Date().toISOString().replace(/[-:.]/g, '').slice(0, 15) + 'Z',
        'DTSTART;VALUE=DATE:' + s, 'DTEND;VALUE=DATE:' + e,
        'SUMMARY:' + name.replace(/[,;\\]/g, ' ')]
        .concat(city ? ['LOCATION:' + city.replace(/[,;\\]/g, ' ')] : [])
        .concat(['END:VEVENT', 'END:VCALENDAR']).join('\r\n');
      var blob = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      cal.innerHTML =
        '<a class="cal" href="' + gcal + '" target="_blank" rel="noopener">📅 Add to Google Calendar</a>' +
        '<a class="cal" href="' + blob + '" download="celebria-event.ics">🍎 Apple / Outlook (.ics)</a>';
      cal.style.display = 'block';
    }

    function showThanks(d) {
      icon.textContent = r === 'confirmed' ? '🎉' : '✓';
      title.textContent = r === 'confirmed' ? 'See you there!' : 'Response recorded';
      msg.textContent = 'Thank you' + (d.guestName ? ', ' + d.guestName : '') +
        '! Your RSVP for ' + (d.eventName || 'the celebration') + ' has been shared with the hosts.';
      if (r === 'confirmed') showCalendar(d.eventName || 'Celebration', d.eventDate, d.city);
    }

    // One request handles both the initial Yes/No tap and the optional
    // follow-up (partyCount/food are simply omitted on the first call).
    function post(extra) {
      var body = { g: g, r: r };
      if (extra) { body.partyCount = extra.partyCount; body.food = extra.food; }
      return fetch(FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); });
    }

    if (!g || (r !== 'confirmed' && r !== 'declined')) {
      fail('Link incomplete', 'Please use the buttons in your invitation email.');
    } else {
      var yes = r === 'confirmed';
      var targetStatus = yes ? 'Accepted' : 'Declined';
      var lastResult = null;

      function doPost() {
        btn.disabled = true; btn.textContent = 'Sending…';
        keepBtn.style.display = 'none';
        post(null).then(function (out) {
          if (!out.ok || !out.d.ok) {
            return fail('Invitation not found',
              'This invitation may have been removed by the host.' +
              (out.d.detail ? ' (' + out.d.detail + ')' : ''));
          }
          lastResult = out.d;
          btn.style.display = 'none';
          if (yes) {
            // Politely ask for headcount + food before the final thank-you —
            // declines skip straight there, nothing to plan food for.
            icon.textContent = '🎉'; title.textContent = 'Lovely to have you!';
            msg.textContent = 'One more thing, so the hosts can plan the food properly:';
            foodsEl.innerHTML = '';
            FOODS.forEach(function (f) {
              var b = document.createElement('button');
              b.type = 'button'; b.className = 'pill'; b.textContent = f;
              b.onclick = function () {
                food = f;
                Array.prototype.forEach.call(foodsEl.children, function (c) { c.classList.remove('sel'); });
                b.classList.add('sel');
              };
              foodsEl.appendChild(b);
            });
            food = FOODS[0]; foodsEl.children[0].classList.add('sel');
            details.style.display = 'block';
          } else {
            showThanks(lastResult);
          }
        }).catch(function () { fail('Connection trouble', 'Please try the link again in a moment.'); });
      }

      // First-time (or repeat-same-answer) response: the plain single-tap
      // prompt, unchanged from before.
      function showPrompt() {
        icon.textContent = yes ? '💌' : '💌';
        title.textContent = yes ? 'Lovely to have you!' : 'Sorry you can’t make it';
        msg.textContent = 'Tap below to confirm your response to the host.';
        btn.style.display = 'block';
        btn.textContent = yes ? '✅ Yes, I’ll be there' : 'Confirm: can’t make it';
        keepBtn.style.display = 'none';
        btn.onclick = doPost;
      }

      // The guest already answered differently and is now switching — make
      // them confirm the change instead of silently overwriting their
      // earlier reply (works the same both directions: accepted→declined
      // and declined→accepted).
      function showChangeConfirm(priorStatus) {
        icon.textContent = '↺';
        title.textContent = 'You already responded';
        var priorLabel = priorStatus === 'Accepted' ? 'you’d be there' : 'you couldn’t make it';
        var newLabel = yes ? '“Yes, I’ll be there”' : '“Can’t make it”';
        msg.textContent = 'You previously told us ' + priorLabel + '. Would you like to change your response to ' + newLabel + '?';
        btn.style.display = 'block';
        btn.textContent = yes ? 'Yes, change to attending' : 'Yes, change to not attending';
        btn.onclick = doPost;
        keepBtn.style.display = 'block';
        keepBtn.textContent = 'No, keep my previous response';
        keepBtn.onclick = function () {
          icon.textContent = '✓'; title.textContent = 'No changes made';
          msg.textContent = 'Your response stays as it was — thanks for double-checking!';
          btn.style.display = 'none'; keepBtn.style.display = 'none';
        };
      }

      // Read the guest's CURRENT stored answer first (read-only — never
      // writes) so we know whether this tap is a fresh response or a
      // changed one, before showing either prompt above.
      title.textContent = 'One tap to RSVP';
      msg.textContent = 'Loading your invitation…';
      fetch(FN + '?g=' + encodeURIComponent(g) + '&check=1')
        .then(function (res) { return res.json(); })
        .then(function (out) {
          var prior = out && out.ok ? out.status : null;
          if (prior && prior !== 'Pending' && prior !== targetStatus) {
            showChangeConfirm(prior);
          } else {
            showPrompt();
          }
        })
        .catch(function () { showPrompt(); }); // status check failing shouldn't block RSVP-ing

      document.getElementById('minus').onclick = function () { count = Math.max(1, count - 1); countEl.textContent = count; };
      document.getElementById('plus').onclick = function () { count = Math.min(50, count + 1); countEl.textContent = count; };

      document.getElementById('saveDetails').onclick = function (e) {
        e.target.disabled = true; e.target.textContent = 'Saving…';
        post({ partyCount: count, food: food }).then(function (out) {
          details.style.display = 'none';
          showThanks((out.ok && out.d.ok) ? out.d : lastResult);
        }).catch(function () {
          details.style.display = 'none';
          showThanks(lastResult);
        });
      };
      document.getElementById('skipDetails').onclick = function () {
        details.style.display = 'none';
        showThanks(lastResult);
      };
    }
  </script>
</body>
</html>
